name: Build example site

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build amagaki, example site, and starter
        run: |
          npm run build -w packages/amagaki
          npm run build:example -w packages/amagaki
          node ./packages/amagaki/dist/src/cli.js build ./examples/starter
