name: Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.releases_created }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.releases_created }}
      - name: Install and build packages
        run: |
          npm ci
          npm run build -w packages/amagaki
          npm run build -w packages/amagaki-plugin-page-builder
          npm run build -w packages/amagaki-engine-preact
          npm run build -w packages/create-amagaki
        if: ${{ steps.release.outputs.releases_created }}
      - run: npm publish -w packages/amagaki
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs['packages/amagaki--release_created'] }}
      - run: npm publish -w packages/amagaki-engine-preact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs['packages/amagaki-engine-preact--release_created'] }}
      - run: npm publish -w packages/amagaki-plugin-page-builder
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs['packages/amagaki-plugin-page-builder--release_created'] }}
      - run: npm publish -w packages/create-amagaki
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs['packages/create-amagaki--release_created'] }}
