title: Amagaki — TypeScript static site generator
include_site_title: false
description: Amagaki is a TypeScript-based static site generator for hand-coding marketing and informational websites with structured content, localization, and plugins.
layout: home

hero:
  title: A TypeScript static site generator for hand‑coded websites
  body: Amagaki is a lightweight, extensible website generator written in TypeScript. It separates structured YAML and Markdown content from HTML templates, includes first-class localization and build profiling, and stays out of your frontend stack's way.
  buttons:
    - label: Read the docs
      doc: /content/docs/index.md
      icon: arrow_forward
      variant: primary
    - label: API Reference
      url: /api/
    - label: Explore the starter
      doc: /content/docs/getting-started/starter-project.md

quickstart:
  title: Quick start
  body: |
    Amagaki is distributed as an npm package (Node.js 20+). To scaffold a zero-bundler starter site from [`examples/starter/`](https://github.com/blinkk/amagaki/tree/main/examples/starter), run:

    ```bash
    # Create a new Amagaki project interactively
    npx create-amagaki my-site
    cd my-site

    # Start the dev server (renders pages on request)
    npm run dev

    # Build the static site to ./build/
    npm run build
    ```

    Or install `@amagaki/amagaki` directly in an existing project:

    ```bash
    npm install --save @amagaki/amagaki
    ```

features:
  title: Key features
  items:
    - title: Built-in build profiling
      body: Every build tracks memory usage, output sizes, route counts, and missing translations, with detailed per-template and per-route timing tables via <code>--profile</code>.
    - title: Plain HTML, CSS, and TypeScript
      body: Focus on templates, styling, and content architecture without heavy frontend framework boilerplate or opaque build pipelines.
    - title: Not a frontend framework
      body: Amagaki generates plain static files. Pair it with vanilla JS, Web Components, Preact, or any frontend tooling you choose.
    - title: Extensible in TypeScript
      body: Configure routes, custom YAML types, template filters, Express dev-server middleware, and build hooks directly in <code>amagaki.ts</code>.
    - title: First-class localization
      body: Define site, collection, and document locales natively, resolve localized fields with <code>!IfLocale</code>, and manage translatable strings with <code>!pod.string</code>.
    - title: Structured content layer
      body: Model repeatable collections, partial modules, and cross-document references in YAML and Markdown without hardcoding URLs.

sections:
  - body: |
      ## Why Amagaki?

      Amagaki was designed specifically for marketing and informational websites that sit between simple blogs and full single-page applications:

      - **TypeScript-first:** Write configuration, plugins, and custom routes in TypeScript using the same Node.js ecosystem as your frontend.
      - **Clean content/template separation:** Store copy, structured fields, and cross-references in YAML/Markdown while keeping presentation in Nunjucks or custom template engines.
      - **On-demand dev server:** During development, pages render on request rather than triggering full site rebuilds on every edit.
      - **Maintenance status:** Amagaki continues to be maintained for existing sites with bug fixes and dependency updates. For new projects, we recommend [Root.js](https://rootjs.dev) — Blinkk's modern successor built with TypeScript, Preact/TSX, file routing, i18n, and a built-in CMS.

      ## Open source

      Amagaki is released under the MIT License and maintained by [Blinkk](https://blinkk.com). View the source code, file issues, or browse related packages on [GitHub](https://github.com/blinkk/amagaki).
